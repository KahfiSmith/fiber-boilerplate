openapi: 3.1.0
info:
  title: Fiber Boilerplate REST API
  description: Canonical OpenAPI specification for Fiber & Next.js full-stack system.
  version: 1.0.0
servers:
  - url: /
    description: Current host server

paths:
  /api/v1/health:
    get:
      summary: Health check
      description: Returns health status of application, PostgreSQL database, and Redis.
      responses:
        "200":
          description: Health check response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthApiResponse"

  /api/v1/auth/register:
    post:
      summary: Register a new user
      description: Create a new account and receive session + access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=...; Path=/api/v1/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthApiResponse"
        "400":
          description: Validation or registration error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"

  /api/v1/auth/login:
    post:
      summary: Login user
      description: Authenticate with email & password. Sets HttpOnly refresh token cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=...; Path=/api/v1/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthApiResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      description: Rotate refresh token cookie and obtain a new short-lived access token.
      responses:
        "200":
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=...; Path=/api/v1/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthApiResponse"
        "401":
          description: Invalid, expired, or reused refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"

  /api/v1/auth/logout:
    post:
      summary: Logout user
      description: Revokes session family and clears refresh cookie.
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessApiResponse"

  /api/v1/auth/me:
    get:
      summary: Get current authenticated user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserApiResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"

  /api/v1/auth/forgot-password:
    post:
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Password reset requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessApiResponse"

  /api/v1/auth/reset-password:
    post:
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessApiResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"

  /api/v1/auth/verify-email:
    post:
      summary: Verify email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessApiResponse"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"

  /api/v1/auth/resend-verification:
    post:
      summary: Resend email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Verification resend initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessApiResponse"

  /api/v1/auth/account:
    delete:
      summary: Delete user account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "200":
          description: Account deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessApiResponse"
        "401":
          description: Invalid password or unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"

  /api/v1/auth/sessions:
    get:
      summary: List active user sessions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active sessions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsApiResponse"
    delete:
      summary: Revoke all other active user sessions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessApiResponse"

  /api/v1/auth/sessions/{id}:
    delete:
      summary: Revoke a specific session by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessApiResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required:
        - reset_token
        - new_password
      properties:
        reset_token:
          type: string
        new_password:
          type: string
          minLength: 8

    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    ResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    DeleteAccountRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string

    User:
      type: object
      required:
        - id
        - name
        - email
        - role
        - is_email_verified
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        is_email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthData:
      type: object
      required:
        - access_token
        - expires_in
        - user
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/User"

    SessionItem:
      type: object
      required:
        - session_id
        - issued_at
        - last_used_at
        - current
      properties:
        session_id:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        issued_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean

    HealthData:
      type: object
      required:
        - app
        - status
        - database
        - redis
      properties:
        app:
          type: string
        status:
          type: string
        database:
          type: string
        redis:
          type: string

    AuthApiResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/AuthData"
        request_id:
          type: string

    UserApiResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/User"
        request_id:
          type: string

    SessionsApiResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/SessionItem"
        request_id:
          type: string

    HealthApiResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/HealthData"
        request_id:
          type: string

    SuccessApiResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          nullable: true
        request_id:
          type: string

    ErrorApiResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        error:
          nullable: true
        request_id:
          type: string
